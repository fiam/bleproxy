# cargo-deny supply-chain policy. Run with `cargo deny check` or
# `cargo xtask deny`. Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# Evaluate the dependency graph for every platform we ship, not just the
# machine running the check.
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    # Firmware: ESP32-C3 and ESP32-S3.
    "riscv32imc-unknown-none-elf",
    "xtensa-esp32s3-none-elf",
]
# Include the dependencies behind every firmware chip feature.
all-features = true

[advisories]
# RustSec advisories (vulnerabilities, unsoundness, unmaintained crates).
# Any match fails the check; an exception must go in `ignore` with a reason.
unmaintained = "all"
yanked = "deny"
ignore = [
    # Both are "unmaintained" notices, not vulnerabilities, for crates that
    # only run at compile time and that we only reach through esp-hal.
    { id = "RUSTSEC-2024-0436", reason = "paste: proc-macro used by esp-hal and riscv" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml: build-time config parsing in esp-config" },
]

[licenses]
# Everything must be compatible with distributing bleproxy under
# MIT OR Apache-2.0. Extend this list deliberately, never with copyleft.
allow = ["Apache-2.0", "ISC", "MIT", "Unicode-3.0"]
confidence-threshold = 0.93
# Fail when an allowed license is no longer used, keeping the list minimal.
unused-allowed-license = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Workspace crates reference each other by path only; they are not
# published, so there is no version requirement to get wrong.
allow-wildcard-paths = true
highlight = "all"
skip-tree = [
    # The esp-rs crates deliberately depend on several major versions of the
    # same crates (embedded-hal 0.2 and 1.0, digest 0.10 and 0.11, ...).
    # Those duplicates can only be fixed upstream, so they are not checked;
    # the host graph stays duplicate-free.
    { crate = "bleproxy-esp32", reason = "duplicates inherited from esp-rs crates" },
]
deny = [
    # TLS, when needed, should come from rustls rather than system OpenSSL,
    # which complicates static and cross builds.
    { crate = "openssl-sys", reason = "use rustls instead" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
