[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "xtask"]
# Everything except the firmware, which needs a bare-metal target and a chip
# feature (see `cargo xtask esp32`). Plain cargo commands stay host-only.
default-members = ["apps/bleproxy", "crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Minimum supported Rust version, verified by `cargo xtask msrv`. Day-to-day
# development uses the newer toolchain pinned in rust-toolchain.toml. The
# floor is set by the ESP32 dependencies (esp-hal, esp-rtos), and staying
# below the latest stable lets the esp-rs Xtensa toolchain, which lags
# upstream Rust, build the firmware.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fiam/bleproxy"
homepage = "https://github.com/fiam/bleproxy"
authors = ["The bleproxy contributors"]

[workspace.dependencies]
# Internal crates are referenced by path only, so release version bumps
# (release-please) never have to keep requirements in sync.
bleproxy-core = { path = "crates/bleproxy-core" }
bleproxy-protocol = { path = "crates/bleproxy-protocol" }

clap = { version = "4.6.7", features = ["derive", "env"] }
mdns-sd = "0.21.7"
# `default-features = false` keeps it usable from `no_std` crates.
thiserror = { version = "2.0.21", default-features = false }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "std"] }

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Directly contradicts rustc's `unreachable_pub`, which we keep: it makes
# crate-internal items explicit with `pub(crate)`.
redundant_pub_crate = "allow"
# Prefer typed errors over panics. clippy.toml re-allows these in tests.
expect_used = "warn"
panic = "warn"
unwrap_used = "warn"
# Keep placeholders and debugging leftovers out of the tree.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
codegen-units = 1
lto = true
