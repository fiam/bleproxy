[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fiam/bleproxy"
homepage = "https://github.com/fiam/bleproxy"
authors = ["The bleproxy contributors"]

[workspace.dependencies]
bleproxy-core = { path = "crates/bleproxy-core", version = "0.1.0" }
bleproxy-protocol = { path = "crates/bleproxy-protocol", version = "0.1.0" }

clap = { version = "4.6.7", features = ["derive"] }
# `default-features = false` keeps it usable from `no_std` crates.
thiserror = { version = "2.0.21", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Directly contradicts rustc's `unreachable_pub`, which we keep: it makes
# crate-internal items explicit with `pub(crate)`.
redundant_pub_crate = "allow"
# Prefer typed errors over panics. clippy.toml re-allows these in tests.
expect_used = "warn"
panic = "warn"
unwrap_used = "warn"
# Keep placeholders and debugging leftovers out of the tree.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
codegen-units = 1
lto = true
