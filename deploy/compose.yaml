# Docker Compose service for bleproxy.
#
#   docker compose -f deploy/compose.yaml up -d
#
# Use :latest for releases or :edge for the newest build of main.
services:
  bleproxy:
    image: ghcr.io/fiam/bleproxy:edge
    restart: unless-stopped
    # mDNS needs the host's network, and Home Assistant connects to :6053.
    network_mode: host
    volumes:
      # The host's system bus, where BlueZ (bluetoothd) lives.
      - /run/dbus:/run/dbus:ro
    environment:
      BLEPROXY_LOG: info
      # BLEPROXY_NAME: bleproxy-garage
      # BLEPROXY_FRIENDLY_NAME: Garage
      # BLEPROXY_ADAPTER: hci0
      # Devices Home Assistant may connect to at once (0 turns it off).
      # BLEPROXY_CONNECTION_SLOTS: "3"
      # Only forward these devices (comma-separated); all of them if unset.
      # BLEPROXY_ALLOW_ADDRESS: 5C:CA:D3:BA:BA:CC
      # Encrypt the API; Home Assistant asks for this key when adding the
      # proxy. Generate one with `openssl rand -base64 32`. To keep it out
      # of the environment, use BLEPROXY_ENCRYPTION_KEY_FILE with a file
      # readable by the container's user (nobody) instead.
      # BLEPROXY_ENCRYPTION_KEY: <base64 key>
